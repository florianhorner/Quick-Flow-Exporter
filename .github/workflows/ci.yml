name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm run check:node
      - run: npm run check:version
      - run: npm ci
      - run: npm run check:public-files
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run check:css
      - run: npm run build:extension

  setup-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        installer: [nvm, homebrew]
    env:
      SETUP_INSTALLER: ${{ matrix.installer }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Set isolated nvm directory
        shell: bash
        run: echo "NVM_DIR=$RUNNER_TEMP/quick-flow-nvm" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Check out pinned nvm
        if: matrix.installer == 'nvm'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nvm-sh/nvm
          ref: 977563e97ddc66facf3a8e31c6cff01d236f09bd # v0.40.3
          path: .ci-nvm
          persist-credentials: false
      - name: Prepare isolated nvm installation
        if: matrix.installer == 'nvm'
        shell: bash
        run: mv .ci-nvm "$NVM_DIR"
      - name: Repair unsupported runtime and validate the workspace
        shell: bash
        run: |
          if node scripts/check-node-version.mjs >/dev/null 2>&1; then
            echo 'Expected an unsupported starting runtime' >&2
            exit 1
          fi
          source scripts/conductor-setup.sh
          npm run check:node
          if [[ "$SETUP_INSTALLER" = nvm ]]; then
            test "$(node --version)" = "v$(cat .nvmrc)"
          else
            required_major=$(cut -d. -f1 .nvmrc | tr -d v)
            test "$(command -v node)" = "$(brew --prefix "node@$required_major")/bin/node"
          fi
          git diff --exit-code -- package.json package-lock.json
          npm run typecheck
          npm test
          npm run build
          npm run check:css
          npm run build:extension

  tooling-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run check:node
      - run: npm run check:version
      - run: npm run test:tooling
      - run: npm run test:repository

  runtime-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.15.0', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm run check:node
      - run: npm run check:version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:css
      - run: npm run build:extension
